[project]
name = "forecastlab-backend"
version = "1.0.0"
description = "ForecastLab — AI Demand Planning & S&OP Decision Intelligence (FastAPI backend)"
authors = [{ name = "Wallison Sampaio" }]
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # long f-strings in narrative templates
  "B008",   # FastAPI Depends/Query defaults
  "RUF001", # intentional unicode (±, –) in user-facing text
  "RUF002",
  "RUF003",
  "SIM102", # nested ifs kept where they read as business rules
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["app/metrics", "app/model_selection", "app/backtesting"]
